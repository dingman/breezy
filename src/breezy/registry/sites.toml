# day becomes EXPECTED, `ingest/gaps.py:419-441,1044-1050`,
# `nws_actor.py:1696-1697`) -- a property of the NWS product for this
# station, identical regardless of which venue settles on it. Pinning it to
# `settlement_time_local` would collapse the 08:00-11:00 review window to
# zero and manufacture false-positive gaps (`gaps.py:59-63`). Kalshi's own
# review mechanism (the unrelated 300s `determined` dispute timer) plays no
# part here.
settlement_delay_time_local = "11:00"
settlement_delay_timezone = "America/New_York"
no_data_fallback_days = 7

[sites.kalshi.MIA.open_meteo]
settlement_eligible = false
lat = 25.79056
lon = -80.31639
elevation_m = 3.048

