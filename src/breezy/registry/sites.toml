# -----------------------------------------------------------------------------
# Chicago — Chicago Midway Airport (NOT O'Hare)
# AWIPS PIL: CLIMDW   WMO: CDUS43 KLOT
# Header verbatim from product 4c320984-bf26-4f5d-a9fc-0a0bdc163bb4 (KLOT,
# 2026-08-22T06:33:00Z):
#   ...THE CHICAGO-MIDWAY CLIMATE SUMMARY FOR AUGUST 21 2026...
# Sibling decoy verified rejected: ...THE CHICAGO-OHARE CLIMATE SUMMARY FOR...
# KLOT issues BOTH under an identical issuingOffice. The `MIDWAY` token is
# the discriminator; a `THE CHICAGO.*` pattern matches O'Hare too.
# The hyphen carries `\s*` on both sides for the same reason the other
# patterns use `\s+` between tokens (see the Burbank double-space case);
# every verified sample renders it as a bare `CHICAGO-MIDWAY`.
# -----------------------------------------------------------------------------
[sites.polymarket_us.MDW]
icao = "KMDW"
cli_location = "MDW"
venue_city_token = "mdw"
issuing_office = "KLOT"
iana_tz = "America/Chicago"
std_utc_offset_hours = -6.0
body_header_regex = '^\.\.\.THE\s+CHICAGO\s*-\s*MIDWAY\s+CLIMATE\s+SUMMARY\s+FOR\b'
never_substitute = ["KORD"]
never_substitute_cli_locations = ["ORD"]
# VENUE clock, NOT this site's local clock. `settlement_time_local` must
# always be read together with `settlement_timezone`; for MDW, LAX and SFO
# the settlement instant is NOT 08:00 at the station.
