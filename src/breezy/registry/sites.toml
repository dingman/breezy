# =============================================================================
# Kalshi — sibling venue table (KALSHI_CRH_EXPANSION_PLAN_2026-09-04 S4)
# =============================================================================
#
# A [sites.kalshi.*] ENTRY IS SETTLEMENT TRUTH ONLY -- IT IS NOT AN INGEST
# SITE. This step (S4) adds registry identity for Kalshi's four shared
# stations; there is no `KalshiIngestActor` and no Kalshi ingest deployment
# (that lands at build-order S7). The running NWS-ingest unit's configured
# site set (`BREEZY_SITES`, or the unset-default derivation in
# `runtime/settings.py::_registry_site_pairs`/`_DERIVABLE_INGEST_VENUES`)
# must NEVER include `kalshi:<city>` for a city already polled as
# `polymarket_us:<city>`: a second `NwsIngestActor`/`NwsObservationActor`
# reading the identical CLI product doubles the NWS request rate under the
# ONE shared `CrossSite403Window` (`ingest/shared_state.py:429-432,594-611`)
# for a station that is already covered. `_registry_site_pairs` filters the
# unset-default derivation to `_DERIVABLE_INGEST_VENUES` (today
# `polymarket_us` only) for exactly this reason; an explicit
# `BREEZY_SITES=kalshi:LAX,polymarket_us:LAX` selection is NOT currently
# refused by the loader/validator (`settings.py::_parse_sites` is
# syntax-only; `SharedIngestState._validate_sites` checks registry
# membership per pair, not cross-venue-same-ICAO collisions) -- this is a
# known gap, to be closed alongside the Kalshi ingest actor at S7, not here.
#
# Same four PHYSICAL stations as the polymarket_us entries above -- icao,
# cli_location, issuing_office, iana_tz, std_utc_offset_hours,
# body_header_regex and both never_substitute lists are IDENTICAL to the PM
# entries for LAX/MDW/MIA/SFO and are RE-VERIFIED LIVE on 2026-09-04 (not
# copied blind): /stations/{icao} timezone matched, and the latest CLI
# product body header for each city was refetched from api.weather.gov and
# matches the existing regex byte-for-byte (see per-entry header quotes
# below, each dated 2026-09-04). Kalshi lists no NYC daily-temperature
# series in this batch, so no [sites.kalshi.NYC] entry exists.
#
# SETTLEMENT SOURCE IS THE WEATHER COMPANY, NOT THE NWS CLI DIRECTLY.
# Kalshi's own rules text (S0 §10.4) names the CLI station as the
# *identifier* ("the maximum temperature recorded at Los Angeles
# (CLILAX) ... according to The Weather Company") but settles on The
# Weather Company's reported value, not the raw CLI product. The CLI is
# therefore outcome TRUTH for divergence measurement (plan S8/S15
# per-station CLI-final-vs-TWC reconciliation, n>=90, Wilson-lower>0.99),
# never assumed identical to the venue's settled result.
#
# SETTLEMENT-CLOCK VALUES -- stated from vendor evidence, not measured yet.
# `settlement_time_local`/`settlement_timezone` = the LATER of the two
# published ET instants ("the first 7:00 or 8:00 AM ET following the
# release of the data"); nothing in Breezy acts before the deadline, so the
# late bound is the conservative one (VERIFIED, docs/evidence/venue/kalshi/
# s0_2026-09-04/S0_FINDINGS_2026-09-04.md §10.4).
# `no_data_fallback_days = 7` -- VERIFIED from "or one week after".
# `settlement_delay_time_local`/`settlement_delay_timezone` -- Kalshi
# publishes NO CLI-disagreement review delay analogous to the PM venue's
# 11:00 ET review clock; its only nearby mechanism is the unrelated 300s
# `determined` dispute timer. VENUE-UNCONFIRMED: pinned pessimistically to
# the same instant as `settlement_time_local`/`settlement_timezone` (i.e.
# no earlier release than the deadline), to be REPLACED by the S15
# 20-settlement observation campaign's measurement. Do not treat this pin
# as a verified value.
# =============================================================================

