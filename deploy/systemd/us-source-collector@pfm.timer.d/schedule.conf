# PFM: poll the latest product per closed WFO hourly (issuance times are read from the WMO
# header, so the cadence bounds only the first-seen precision). The 16:40 slot is omitted (it
# lies inside the launch window); the 17:10Z firing picks up the latest product.
[Timer]
OnCalendar=
OnCalendar=*-*-* 0..15,17..23:40:00 UTC
OnCalendar=*-*-* 17:10:00 UTC
