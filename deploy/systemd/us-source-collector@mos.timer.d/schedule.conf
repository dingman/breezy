# GFS MOS (IEM, availability only): poll every 15 min (runs are 6-hourly; polling per run starts
# 2 h after the runtime), so the first-seen lag is bounded by 15 min. No slot lies inside the
# launch window [16:30Z, 17:10Z).
[Timer]
OnCalendar=
OnCalendar=*-*-* 0..15,18..23:00,15,30,45:00 UTC
OnCalendar=*-*-* 16:00,15:00 UTC
OnCalendar=*-*-* 17:15,30,45:00 UTC
