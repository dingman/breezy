# Routine METAR observations from the live observation endpoint (availability only). The host is
# shared with the live node's obs feed, so the leg is report-minute-targeted: nine firings an hour
# at :54 :57 :00 :03 :06 :10 :15 :20 :28, and in-process a station is polled only in
# [its routine minute (:51 KNYC, :53 KLAX/KMDW/KMIA, :56 KSFO), +35 min] and not after its report
# is seen. First-seen precision: <= 5 min for 15 min after the report, <= 10 min after (an
# unseen report is picked up, flagged late, by a later firing's fetch). At most 9 requests per
# station-hour (<= 216 a day, well under the live actor's ~288). No slot lies inside the launch
# window [16:30Z, 17:10Z); a 16:28 slot is omitted because RuntimeMaxSec=280 would cross 16:30Z.
[Timer]
OnCalendar=
OnCalendar=*-*-* 0..15,18..23:00,03,06,10,15,20,28,54,57:00 UTC
OnCalendar=*-*-* 16:00,03,06,10,15,20:00 UTC
OnCalendar=*-*-* 17:10,15,20,28,54,57:00 UTC
