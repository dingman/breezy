# LAV (IEM, availability only): poll every 10 min, so the first-seen lag is bounded by 10 min.
# No slot lies inside the launch window [16:30Z, 17:10Z); the last pre-window slot (16:20) ends
# by 16:30 under RuntimeMaxSec=600, and the collector refuses in-process any firing that starts
# inside the window.
[Timer]
OnCalendar=
OnCalendar=*-*-* 0..15,18..23:00,10,20,30,40,50:00 UTC
OnCalendar=*-*-* 16:00,10,20:00 UTC
OnCalendar=*-*-* 17:10,20,30,40,50:00 UTC
