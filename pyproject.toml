[project]
name = "breezy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Release Bot", email = "bot@adops.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "nautilus-trader==1.231.0",
    "httpx>=0.28",
    # CORE, not an extra, and pinned exactly. `signing.py` imports `nacl` at
    # module scope and holds order-submission barrier B2 (the signer refuses
    # any method but GET). Behind the `polymarket-us` extra the barrier's test
    # suite SKIPPED on a default checkout -- a guard that never runs is
    # indistinguishable from a guard that passes. Exact pin because this is
    # the cryptographic primitive under a safety barrier.
    "pynacl==1.6.2",
    # CORE, promoted from the `backfill` extra (SCORER_TALLY_BCA_BRIEF_
    # 2026-09-04.md, item 10). `settlement/roi_bound.py` (6e) is the R-9
    # stop-gate BCa bootstrap consumer and imports `scipy.stats.bootstrap`
    # at module scope; per L-1, reuse over hand-rolling a stop-gate
    # quantity means it must actually be importable on a default checkout,
    # not only when the `backfill` extra happens to be installed.
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.112",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[project.optional-dependencies]
backfill = ["pyiem==1.27.0"]
polymarket-us = ["polymarket-us==0.1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q --strict-markers --strict-config -m 'not live and not venue_live and not real_money'"
markers = [
    "contract: pins verified NautilusTrader 1.231.0 behaviour; run first on any version bump",
    "replay: live/backtest parity tests",
    "live: performs REAL network I/O against api.weather.gov and needs BREEZY_LIVE=1; deselected by default",
    "venue_live: test performs real authenticated calls against the live Polymarket.us venue; gated behind BREEZY_VENUE_LIVE=1 AND BREEZY_ALLOW_CREDENTIALED_PYTEST=1 AND --venue-live",
    "real_money: can place or affect real-money venue orders and needs BREEZY_REAL_MONEY=1 plus operator approval; deselected by default",
    "slow: expensive fixture/IO cost (e.g. large synthetic catalogs); opt-in via BREEZY_RUN_SLOW=1 (not deselected by -m addopts)",
    "memory: chunk-count materialization assertions (ING-2 S3); runs in the default gate by design",
    "heavy: real-engine, fork, subprocess or large-fixture tests; runs in the full gate, excluded from the fast tier",
]

[tool.importlinter]
# `nautilus_trader` is rooted, not left external, ONLY so the forbidden
# contract below can name the Polymarket `.com` adapter itself. `grimp`
# squashes external packages to their top-level name, so as an external the
# framework is a single graph node and `lint-imports` refuses
# `nautilus_trader.adapters.polymarket` outright ("subpackages of external
# packages are not valid") -- which is why that contract used to have to ban
# the WHOLE framework. Rooting it costs ~600 extra parsed files (the rest of
# Nautilus is compiled Cython) and no measurable time. No contract constrains
# Nautilus' own internal imports: it is immutable and not ours to shape.
root_packages = ["breezy", "nautilus_trader"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Breezy top-level source packages follow the documented layer direction"
type = "layers"
containers = ["breezy"]
layers = [
    # `app` is the TOP layer: the process composition root constructs
    # strategies and hands already-built objects down to `runtime`. Runtime
    # never imports strategy.
    "app",
    # Offline analysis cores (census, promotion criteria). Reach DOWN into
    # strategy/persistence/settlement for constants and loaders; nothing below
    # may reach up into them, and `app` is barred by the forbidden contract
    # below so the live node process never loads offline analysis code.
    "analysis",
    # `strategy` reaches down into `runtime` for the backtest feed's shared
    # `ClientId` and into `ingest` for the shared weather `DataType`
    # factories. Nothing below `app` may reach back up into it -- the
    # harness in `runtime` takes strategies as constructed objects.
    "strategy",
    "runtime",
    "adapters",
    "ingest",
    # `registry.health_model` hosts the health data types `ingest` needs (layer + import weight).
    "persistence | registry | normalize",
    "settlement",
    "domain",
]
exhaustive = true
ignore_imports = [
    # Current inspected debt from the Polymarket.us read-path slice.
    "breezy.adapters.polymarket_us.config -> breezy.runtime.settings",
    "breezy.adapters.polymarket_us.factories -> breezy.runtime.settings",
]

[[tool.importlinter.contracts]]
name = "Breezy never imports the Nautilus Polymarket .com adapter"
type = "forbidden"
source_modules = ["breezy"]
# The ban is on the Polymarket `.com` adapter -- the thing this contract is
# named for -- and on nothing else. It used to read `["nautilus_trader"]`,
# banning the WHOLE framework, with a hand-maintained per-module allow-list
# of ~30 entries as the unblocker. That inverted the repo's first principle:
# reusing ANY new native meant editing this file, a change invisible from the
# author's seat and caught by no test, while the allow-list -- not the
# contract -- was what actually kept the `.com` adapter out. Naming the
# adapter makes the contract enforce its own name, so the allow-list is
# empty and stays empty.
forbidden_modules = ["nautilus_trader.adapters.polymarket"]
# Unchanged by the narrowing: only DIRECT imports are checked. Any indirect
# route into the `.com` adapter passes through some Breezy module's own
# direct import, which this contract catches; chains through Nautilus'
# internals are Nautilus' business, not a Breezy adoption of the adapter.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Settlement and strategy code never reaches archived backfill records"
type = "forbidden"
source_modules = [
    "breezy.settlement",
    "breezy.strategy",
    "breezy.ingest.nws_actor",
    "breezy.runtime.backtest_feed",
]
forbidden_modules = [
    "breezy.domain.archived_climate_day",
    "breezy.domain.archived_raw_product",
    "breezy.persistence.archive_catalog",
    "breezy.persistence.archive_cache",
    "breezy.persistence.archive_request",
    # SL-4 (FORECAST_NBP_PROBABILISTIC_FAMILY_Rev3_2026-09-29.md §7 row 4,
    # L-12): the derived NBP-backfill store. Live code sees calibration only
    # through the sha-pinned manifest artefact (plan §3.2 item 9); this store
    # is `scripts/analysis/nbp_backfill.py`'s own backfill output, never a
    # settlement/strategy import.
    "breezy.persistence.nbp_derived_store",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "The live trading path never imports the offline analysis layer"
type = "forbidden"
source_modules = [
    "breezy.app", "breezy.strategy", "breezy.runtime", "breezy.adapters",
    "breezy.ingest", "breezy.persistence", "breezy.registry", "breezy.normalize",
    "breezy.settlement", "breezy.domain",
]
forbidden_modules = ["breezy.analysis"]

[[tool.importlinter.contracts]]
name = "The offline analysis layer never DIRECTLY imports Nautilus"
type = "forbidden"
source_modules = ["breezy.analysis"]
forbidden_modules = ["nautilus_trader"]
# The property wanted is NO DIRECT ADOPTION: an analysis module must never
# write `import nautilus_trader`. Indirect chains are unavoidable and are NOT
# adoption -- `analysis` is permitted to import `breezy.strategy`, and
# `breezy.strategy.current_rung_hold.config` imports
# `nautilus_trader.model.identifiers` / `nautilus_trader.trading.config` at
# config.py:59-60, which is also where SUPPORTED_STATIONS (:76) lives. Same
# reasoning, and the same flag, as the `.com` adapter contract above.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "AUD-18 D6(i): the hypothesis ledger stays outside the live import graph, both ways"
type = "forbidden"
# `breezy.analysis.hypothesis_ledger` is a PURE core -- registration and alpha
# bookkeeping only -- so it never needs, and must never gain, a path into the
# live node's own graph. The broader "live path never imports breezy.analysis"
# contract above already covers this module transitively; this contract is
# narrower and DELIBERATELY redundant with it: it names the module itself (not
# the whole layer) so a future `analysis` module that DOES need `strategy`
# (e.g. a triage script reusing settlement config) never has to touch this
# rule, while `hypothesis_ledger` staying analysis-layer-only per AUD-18 SS5 is
# pinned independently of how the rest of `analysis` evolves.
# `breezy.execution` is not a top-level package in this repo (execution-egress
# code lives under `breezy.adapters.polymarket_us.exec`, already covered by
# banning `breezy.adapters` wholesale); import-linter's `forbidden` contract
# requires every named module to exist, so it is not listed by that name here.
source_modules = ["breezy.analysis.hypothesis_ledger"]
forbidden_modules = [
    "breezy.runtime",
    "breezy.adapters",
    "breezy.strategy",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "AUD-18 D6(i): the live import graph never reaches into the hypothesis ledger"
type = "forbidden"
source_modules = [
    "breezy.runtime",
    "breezy.adapters",
    "breezy.strategy",
]
forbidden_modules = ["breezy.analysis.hypothesis_ledger"]
allow_indirect_imports = false

# A8c-R2b: the sending resolver has no sanctioned consumer until AUT-5a. This contract is named
# outside the `ARCH-0 autonomy (` prefix so B8-R2's count of three stays; AUT-5a amends it (and the
# AST guard in tests/unit/test_registry_resolver_guards.py) when it lands the consumer.
[[tool.importlinter.contracts]]
name = "AUT-1 resolver consumers (removed by AUT-5a)"
type = "forbidden"
source_modules = [
    "breezy.app",
    "breezy.strategy",
    "breezy.runtime",
    "breezy.adapters",
]
forbidden_modules = ["breezy.persistence.autonomy.resolver"]
allow_indirect_imports = false

# ARCH-0 seam A (V16, V22, V23). Contracts (b) and (c) name MODULES ONLY, never the
# package: import-linter treats a package source as including every descendant, and
# `label_schema`, `family_bytes`, `byte_binding`, `registry_store`, `replay` and `resolver` legitimately
# reach pyarrow. Import-linter refuses an absent source module, so these lists hold only
# modules that exist; each seam appends the modules it lands.
[[tool.importlinter.contracts]]
name = "ARCH-0 autonomy (a): the autonomy persistence package never imports adapters"
type = "forbidden"
source_modules = ["breezy.persistence.autonomy"]
forbidden_modules = ["breezy.adapters"]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
