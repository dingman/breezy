[project]
name = "breezy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Release Bot", email = "bot@adops.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "nautilus-trader==1.231.0",
    "httpx>=0.28",
    # CORE, not an extra, and pinned exactly. `signing.py` imports `nacl` at
    # module scope and holds order-submission barrier B2 (the signer refuses
    # any method but GET). Behind the `polymarket-us` extra the barrier's test
    # suite SKIPPED on a default checkout -- a guard that never runs is
    # indistinguishable from a guard that passes. Exact pin because this is
    # the cryptographic primitive under a safety barrier.
    "pynacl==1.6.2",
    # CORE, promoted from the `backfill` extra (SCORER_TALLY_BCA_BRIEF_
    # 2026-09-04.md, item 10). `settlement/roi_bound.py` (6e) is the R-9
    # stop-gate BCa bootstrap consumer and imports `scipy.stats.bootstrap`
    # at module scope; per L-1, reuse over hand-rolling a stop-gate
    # quantity means it must actually be importable on a default checkout,
    # not only when the `backfill` extra happens to be installed.
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.112",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[project.optional-dependencies]
backfill = ["pyiem==1.27.0"]
polymarket-us = ["polymarket-us==0.1.2"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored upstream NautilusTrader docs — reference material, not our code.
extend-exclude = [
    "docs/reference/nautilus",
    "docs/evidence/venue/polymarket_us/sdk_snapshot",
]

[tool.ruff.format]
# FROZEN generated module: its bytes are pinned by the regeneration tests
# (test_current_rung_hold_archive_table.py, test_archive_table_upper_bound_2026_09_14.py).
# Formatting it breaks byte-identity (CF-11, 2026-09-28). Lint still applies.
exclude = ["src/breezy/strategy/current_rung_hold/archive_table.py"]

[tool.ruff.lint]
# Isort ordering is enforced by default; E501 must be opted in explicitly
# because Ruff excludes it even under a broad select (formatter-adjacent rule).
extend-select = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
# CF-12: `scripts/` (and `scripts/analysis/`) ships no `__init__.py` --
# deliberate, matching the rest of this `files` list's implicit-namespace-
# package convention -- so without this, mypy resolves
# `scripts/analysis/discovery_set_equality.py` as the bare top-level module
# `discovery_set_equality` when it is globbed directly here, but as the
# qualified `scripts.analysis.discovery_set_equality` when it is reached via
# `tests/unit/test_discovery_set_equality.py`'s own
# `from scripts.analysis.discovery_set_equality import ...` -- two module
# identities for one file, which mypy refuses outright ("Source file found
# twice under different module names"). `explicit_package_bases` makes every
# module name derive from the nearest `__init__.py`-free root under the
# current directory (mypy's own resolution for exactly this shape), so both
# paths agree on `scripts.analysis.discovery_set_equality`. Config-only: it
# changes how a module is NAMED, not what is type-checked or which errors are
# reported for it.
explicit_package_bases = true
# Names `breezy.*` from `src/breezy/...` relative to THIS base, so
# `explicit_package_bases` (above) does not ALSO name the same files
# `src.breezy.*` relative to the current directory -- the two-name collision
# `explicit_package_bases` alone reproduced for every `src/breezy` module the
# moment it was turned on.
mypy_path = "src:scripts/collect"
files = [
    "src/breezy/adapters",
    "src/breezy/normalize",
    "src/breezy/registry",
    "src/breezy/settlement",
    "src/breezy/domain",
    "src/breezy/ingest",
    "src/breezy/persistence",
    "src/breezy/runtime",
    "src/breezy/strategy",
    "src/breezy/analysis",

    # The venue slice. The operator EXECUTES the smoke script against
    # PRODUCTION credentials, so it must be typechecked, and so must the test
    # doubles that claim to model the real classes.
    "scripts/venue",
    # F13-C1 collector (sibling modules import each other by bare name; see mypy_path).
    "scripts/collect",
    # The settlement seam's analysis scripts (Q-3). Previously excluded
    # because the directory carried pre-existing strict errors owned by that
    # seam; those errors are now fixed and the gate is widened to cover it.
    "scripts/analysis",
    # `scripts/archive` (P0). The operator EXECUTES this against the only copy
    # of two irreplaceable datasets, so it is typechecked like the venue smoke.
    "scripts/archive",
    #
    # `tests/` (Q-2). Previously excluded wholesale -- it carried 159
    # pre-existing strict errors across 38 files, so only the polymarket_us
    # slice (whose doubles must not drift from the classes they model) was
    # enumerated by hand. Those errors are now fixed (69 stale
    # `# type: ignore` comments removed, ~83 real typing defects fixed) and
    # the gate is widened to cover the whole directory.
    "tests",
]

# pyarrow ships no stubs, and nautilus_trader's Data base is a compiled Cython
# module (only 4 .pyi files ship). pandas is in the same position: it is a
# transitive nautilus_trader dependency and `StreamingConfig.rotation_interval`
# is typed as `pd.Timedelta`, so the streaming rotation config cannot be
# expressed without touching it. Untyped at the boundary, strict within.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "nautilus_trader.*", "scipy.*", "fsspec.*"]
ignore_missing_imports = true
follow_untyped_imports = false

# nautilus_trader.core.data.Data is a compiled Cython class, so mypy sees it as
# Any and refuses the subclass. Waive ONLY that rule, only for our record types
# — every other strict check still applies to this package.
[[tool.mypy.overrides]]
module = ["breezy.domain.*", "breezy.adapters.polymarket_us.tape_records"]
disallow_subclassing_any = false

# Actor subclasses a compiled Cython class that erases to Any. Scoped to this one
# module deliberately: a package-wide waiver would silently cover future ingest code
# that has no such excuse.
[[tool.mypy.overrides]]
module = [
    "breezy.ingest.nws_actor",
    "breezy.ingest.nws_observation_actor",
    "breezy.ingest.nbm_quantile_actor",
    # EXEC-PAR WP5b: the breaker watcher is a native Actor (same erasure).
    "breezy.runtime.breaker_watcher",
]
disallow_subclassing_any = false

# `Strategy` and `StrategyConfig` are compiled Cython classes that erase to Any,
# so EVERY strategy trips `disallow_subclassing_any`. Package-wide by wildcard,
# unlike the entries above: subclassing the native `Strategy` is the defining
# act of this package rather than an exception within it, and a per-module list
# made "write a strategy" a pyproject edit that `pytest` cannot catch -- the
# suite stayed green at 3153 passed while `mypy` and `lint-imports` both failed.
# Only this ONE rule is waived; every other strict check still applies here.
# Pinned by `tests/unit/test_strategy_module_gate.py`.
[[tool.mypy.overrides]]
module = ["breezy.strategy.*"]
disallow_subclassing_any = false

# Same compiled-Cython-erases-to-Any reason as above, for the two venue-slice
# modules that subclass one. `Actor` (smoke script's QuoteWitness) and `Logger`
# (the leak suite's recording logger) are both Cython classes. Named
# individually, never package-wide: a broad waiver would silently cover future
# code with no such excuse.
[[tool.mypy.overrides]]
module = ["polymarket_us_auth_smoke", "tests.unit.test_polymarket_us_exception_leak"]
disallow_subclassing_any = false

[project.scripts]
breezy = "breezy:main"
# A SEPARATE process from `breezy`, not a subcommand of it: the NWS collector
# must start on a host with no venue configuration, and the quote-tape recorder
# must refuse to start without it. See `breezy.runtime.quote_tape_cli`.
breezy-quote-tape = "breezy.runtime.quote_tape_cli:main"
# BL-23. A THIRD process, and deliberately not a flag on the recorder: it must
# run on a host with no venue configuration, opens no socket, holds no
# credential, and reads the tape READ-ONLY. See
# `breezy.runtime.quote_tape_preflight_cli` for the exit contract (3 =
# TRUNCATION DETECTED).
breezy-quote-tape-preflight = "breezy.runtime.quote_tape_preflight_cli:main"
# EXEC SPINE R-2. A FOURTH process, deliberately not a flag on the recorder:
# it refuses to start without a trading identity of its own
# (`BREEZY_TRADE_TRADER_ID`, no default), writes no tape, and in this
# increment carries NO execution client -- it is the process shell only. See
# `breezy.runtime.trade_cli` for the exit contract.
breezy-trade = "breezy.app.trade:main"
# A FIFTH process, deliberately not automated inside the recorder itself: the
# recorder writer must never also be the process that reads its own output
# back. Converts streamed feather under `<catalog>/live/<instance>/` into the
# parquet layout every analysis script queries -- the step
# `breezy.runtime.quote_tape_cli` explicitly leaves out of scope. Holds no
# venue credential, opens no socket, and never signals the recorder. See
# `breezy.runtime.quote_tape_ingest_cli` for the live-write-avoidance rule.
breezy-quote-tape-ingest = "breezy.runtime.quote_tape_ingest_cli:main"
# A SIXTH process: the operator clear tool for an OPEN submit-intent latch.
# Never a flag on breezy-trade, never on a timer, never at startup. See
# `breezy.runtime.clear_submit_intent_cli`.
breezy-clear-submit-intent = "breezy.runtime.clear_submit_intent_cli:main"
# An EIGHTH process: mirrors `breezy-clear-submit-intent`'s structure and
# safety exactly -- the operator tool that terminates the NO-side bounded
# first-order containment window (PREREG amendment §8 item 4) by writing
# `NO_SIDE_POSITION_SHAPE_CAPTURED_KEY`, the ONLY sanctioned write site for
# that key (E3-7's structural scan). Never a flag on breezy-trade, never on
# a timer, never at startup. See
# `breezy.runtime.mark_no_side_position_captured_cli`.
breezy-mark-no-side-position-captured = "breezy.runtime.mark_no_side_position_captured_cli:main"
# Mirrors `breezy-clear-submit-intent`'s structure and safety exactly: the
# operator clear tool for the `pm_us_crh_cont` family-wide halt
# (`continuous_rung_hold/halt`, see `TrialDayLatch.record_duplicate_fill` /
# `is_family_halted`). There is no automated clear by design -- clearing is
# a build-side decision made with evidence. See
# Lives in the `strategy` layer, not `runtime`, because it touches
# `TrialDayLatch` (`breezy.strategy.current_rung_hold.trial_day_latch`) --
# `runtime` may never import `strategy` (see the layers contract below).
# `breezy.strategy.current_rung_hold.clear_family_halt_cli`.
breezy-clear-family-halt = "breezy.strategy.current_rung_hold.clear_family_halt_cli:main"
# AUD-02b: enforce the A1 ruling
# (`docs/evidence/RULING_A1_pm_us_crh_v4_disposition_2026-09-21.md`) -- the
# SET sibling of `breezy-clear-family-halt` immediately above. Writes exactly
# the same `FAMILY_HALT_KEY` payload shape via the new
# `TrialDayLatch.record_policy_halt`; no new state, no new veto, no new key.
# See `breezy.strategy.current_rung_hold.set_family_halt_cli`.
breezy-set-family-halt = "breezy.strategy.current_rung_hold.set_family_halt_cli:main"
# A SEVENTH process: the detached daily launcher for `breezy-trade`
# (TRADE_NODE_DAILY_RELAUNCH_2026-09-04.md). Values-free -- the seven
# operator-reserved values travel only through its own forwarded `env=`,
# never argv, never a file. Requires the distinct argv token
# `breezy-trade-supervisor-daily` as its first positional argument so
# `pgrep -f` can find it without substring-matching the node's own argv.
# See `breezy.runtime.trade_supervisor`.
breezy-trade-supervisor = "breezy.runtime.trade_supervisor:main"
# [WP-B0] The operator's alert-channel one-shot, deliberately its own
# process and not a flag on the node or the supervisor: it must run on a
# host with no venue configuration, holds no credential, touches no state
# store, and sends exactly ONE alert before exiting. See
# `breezy.runtime.check_alerts_cli` for the exit contract (2 = NO EGRESS
# CONFIGURED, 3 = configured but NOT DELIVERED).
breezy-check-alerts = "breezy.runtime.check_alerts_cli:main"
# AUD-15a: the `OnFailure=` notifier for every study unit in
# `deploy/systemd/` (`breezy-study-failed@.service`). Deliberately its own
# process, mirroring `breezy-check-alerts`'s shape: no credential, no state
# store, one alert, exits 0 unconditionally. See
# `breezy.runtime.study_failure_notifier`.
breezy-study-failed = "breezy.runtime.study_failure_notifier:main"
# AUT-6 WP1: drains the durable alert outbox. Run by breezy-autonomy-alert-redeliver.service under
# the shared bwrap wrapper; see `breezy.runtime.alert_redeliver_cli`.
breezy-autonomy-alert-redeliver = "breezy.runtime.alert_redeliver_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
