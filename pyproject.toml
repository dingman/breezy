[project]
name = "breezy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Release Bot", email = "bot@adops.dev" }
]
requires-python = ">=3.13"
dependencies = [
    "nautilus-trader==1.231.0",
    "httpx>=0.28",
    # CORE, not an extra, and pinned exactly. `signing.py` imports `nacl` at
    # module scope and holds order-submission barrier B2 (the signer refuses
    # any method but GET). Behind the `polymarket-us` extra the barrier's test
    # suite SKIPPED on a default checkout -- a guard that never runs is
    # indistinguishable from a guard that passes. Exact pin because this is
    # the cryptographic primitive under a safety barrier.
    "pynacl==1.6.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-randomly>=3.16",
    "hypothesis>=6.112",
    "respx>=0.21",
    "mypy>=1.13",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[project.optional-dependencies]
backfill = ["pyiem==1.27.0"]
polymarket-us = ["polymarket-us==0.1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-q --strict-markers --strict-config -m 'not live and not venue_live and not real_money'"
markers = [
    "contract: pins verified NautilusTrader 1.231.0 behaviour; run first on any version bump",
    "replay: live/backtest parity tests",
    "live: performs REAL network I/O against api.weather.gov and needs BREEZY_LIVE=1; deselected by default",
    "venue_live: test performs real authenticated calls against the live Polymarket.us venue; gated behind BREEZY_VENUE_LIVE=1 AND BREEZY_ALLOW_CREDENTIALED_PYTEST=1 AND --venue-live",
    "real_money: can place or affect real-money venue orders and needs BREEZY_REAL_MONEY=1 plus operator approval; deselected by default",
]

[tool.importlinter]
root_packages = ["breezy"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Breezy top-level source packages follow the documented layer direction"
type = "layers"
containers = ["breezy"]
layers = [
    # `strategy` is the TOP layer: a strategy reaches down into `runtime` for
    # the backtest feed's shared `ClientId` and into `ingest` for the shared
    # weather `DataType` factories. Nothing may reach back up into it -- the
    # harness in `runtime` takes strategies as constructed objects.
    "strategy",
    "runtime",
    "adapters",
    "ingest",
    "persistence | registry | normalize",
    "features | settlement",
    "domain",
]
exhaustive = true
ignore_imports = [
    # Current inspected debt from the Polymarket.us read-path slice.
    "breezy.adapters.polymarket_us.config -> breezy.runtime.settings",
    "breezy.adapters.polymarket_us.factories -> breezy.runtime.settings",
    # Current inspected debt from the NWS ingest runtime cycle.
    "breezy.ingest.nws_actor -> breezy.runtime.health",
    # Current inspected debt from quote-tape persistence using venue tape records.
    "breezy.persistence.quote_tape_gaps -> breezy.adapters.polymarket_us.tape_records",
]

[[tool.importlinter.contracts]]
name = "Breezy never imports the Nautilus Polymarket .com adapter"
type = "forbidden"
source_modules = ["breezy"]
forbidden_modules = ["nautilus_trader"]
allow_indirect_imports = true
ignore_imports = [
    "breezy.adapters.polymarket_us.config -> nautilus_trader",
    "breezy.adapters.polymarket_us.credentials -> nautilus_trader",
    "breezy.adapters.polymarket_us.data -> nautilus_trader",
    "breezy.adapters.polymarket_us.factories -> nautilus_trader",
    # Subclasses the native `backtest.models.FeeModel` extension point.
    "breezy.adapters.polymarket_us.fees -> nautilus_trader",
    "breezy.adapters.polymarket_us.parsing -> nautilus_trader",
    "breezy.adapters.polymarket_us.provider -> nautilus_trader",
    "breezy.adapters.polymarket_us.secure -> nautilus_trader",
    "breezy.adapters.polymarket_us.signing -> nautilus_trader",
    "breezy.adapters.polymarket_us.symbology -> nautilus_trader",
    "breezy.adapters.polymarket_us.tape_records -> nautilus_trader",
    "breezy.adapters.polymarket_us.transport -> nautilus_trader",
    "breezy.adapters.polymarket_us.websocket -> nautilus_trader",
    "breezy.domain.nws_climate_day -> nautilus_trader",
    "breezy.domain.nws_raw_product -> nautilus_trader",
    "breezy.ingest.config -> nautilus_trader",
    "breezy.ingest.nws_actor -> nautilus_trader",
    "breezy.persistence.catalog -> nautilus_trader",
    "breezy.persistence.quote_tape_gaps -> nautilus_trader",
    # Wraps weather records in the native `CustomData` envelope and names
    # the native `ClientId` -- both are Nautilus extension points.
    "breezy.runtime.backtest_feed -> nautilus_trader",
    # Composes the native `BacktestEngine` and subclasses nothing.
    "breezy.runtime.backtest_harness -> nautilus_trader",
    # Subscribes to the native `MessageBus` order-event topic and subclasses
    # nothing; reads `OrderInitialized`/`OrderSide` to screen order intent.
    "breezy.runtime.backtest_order_guard -> nautilus_trader",
    # WILDCARD, deliberately, over the whole `breezy.strategy` subtree: every
    # strategy subclasses the native `Strategy`/`StrategyConfig` extension
    # points, so a per-module entry made "write a strategy" a pyproject edit
    # that nothing in `pytest` catches. `**` (whole subtree) rather than `*`
    # (direct children only) so a strategy in a subpackage is covered too.
    #
    # This does NOT weaken the architecture. The LAYERS contract above still
    # constrains what `strategy` may import from `breezy` -- it is the TOP
    # layer, so nothing may reach back into it, and it may only reach DOWN.
    # All this waives is the blanket "no `nautilus_trader` anywhere" rule,
    # whose purpose is to keep the Polymarket .com adapter out of Breezy;
    # `nautilus_trader.trading.strategy` is the native extension point a
    # strategy exists to subclass. Pinned by
    # `tests/unit/test_strategy_module_gate.py`, which synthesises a brand-new
    # strategy module and runs the real `lint-imports` over it.
    "breezy.strategy.** -> nautilus_trader",
    "breezy.runtime.cli -> nautilus_trader",
    "breezy.runtime.composition -> nautilus_trader",
    "breezy.runtime.logging_bridge -> nautilus_trader",
    "breezy.runtime.node_config -> nautilus_trader",
    "breezy.runtime.quote_tape_cli -> nautilus_trader",
]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendored upstream NautilusTrader docs — reference material, not our code.
extend-exclude = [
    "docs/reference/nautilus",
    "docs/evidence/venue/polymarket_us/sdk_snapshot",
]

[tool.ruff.lint]
# Isort ordering is enforced by default; E501 must be opted in explicitly
# because Ruff excludes it even under a broad select (formatter-adjacent rule).
extend-select = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "src/breezy/adapters",
    "src/breezy/normalize",
    "src/breezy/registry",
    "src/breezy/settlement",
    "src/breezy/domain",
    "src/breezy/ingest",
    "src/breezy/persistence",
    "src/breezy/runtime",
    "src/breezy/strategy",

    # The venue slice. The operator EXECUTES the smoke script against
    # PRODUCTION credentials, so it must be typechecked, and so must the test
    # doubles that claim to model the real classes.
    "scripts/venue",
    # The settlement seam's analysis scripts (Q-3). Previously excluded
    # because the directory carried pre-existing strict errors owned by that
    # seam; those errors are now fixed and the gate is widened to cover it.
    "scripts/analysis",
    #
    # `tests/` (Q-2). Previously excluded wholesale -- it carried 159
    # pre-existing strict errors across 38 files, so only the polymarket_us
    # slice (whose doubles must not drift from the classes they model) was
    # enumerated by hand. Those errors are now fixed (69 stale
    # `# type: ignore` comments removed, ~83 real typing defects fixed) and
    # the gate is widened to cover the whole directory.
    "tests",
]

# pyarrow ships no stubs, and nautilus_trader's Data base is a compiled Cython
# module (only 4 .pyi files ship). pandas is in the same position: it is a
# transitive nautilus_trader dependency and `StreamingConfig.rotation_interval`
# is typed as `pd.Timedelta`, so the streaming rotation config cannot be
# expressed without touching it. Untyped at the boundary, strict within.
[[tool.mypy.overrides]]
module = ["pyarrow.*", "pandas.*", "nautilus_trader.*"]
ignore_missing_imports = true
follow_untyped_imports = false

# nautilus_trader.core.data.Data is a compiled Cython class, so mypy sees it as
# Any and refuses the subclass. Waive ONLY that rule, only for our record types
# — every other strict check still applies to this package.
[[tool.mypy.overrides]]
module = ["breezy.domain.*", "breezy.adapters.polymarket_us.tape_records"]
disallow_subclassing_any = false

# Actor subclasses a compiled Cython class that erases to Any. Scoped to this one
# module deliberately: a package-wide waiver would silently cover future ingest code
# that has no such excuse.
[[tool.mypy.overrides]]
module = ["breezy.ingest.nws_actor"]
disallow_subclassing_any = false

# `Strategy` and `StrategyConfig` are compiled Cython classes that erase to Any,
# so EVERY strategy trips `disallow_subclassing_any`. Package-wide by wildcard,
# unlike the entries above: subclassing the native `Strategy` is the defining
# act of this package rather than an exception within it, and a per-module list
# made "write a strategy" a pyproject edit that `pytest` cannot catch -- the
# suite stayed green at 3153 passed while `mypy` and `lint-imports` both failed.
# Only this ONE rule is waived; every other strict check still applies here.
# Pinned by `tests/unit/test_strategy_module_gate.py`.
[[tool.mypy.overrides]]
module = ["breezy.strategy.*"]
disallow_subclassing_any = false

# Same compiled-Cython-erases-to-Any reason as above, for the two venue-slice
# modules that subclass one. `Actor` (smoke script's QuoteWitness) and `Logger`
# (the leak suite's recording logger) are both Cython classes. Named
# individually, never package-wide: a broad waiver would silently cover future
# code with no such excuse.
[[tool.mypy.overrides]]
module = ["polymarket_us_auth_smoke", "tests.unit.test_polymarket_us_exception_leak"]
disallow_subclassing_any = false

[project.scripts]
breezy = "breezy:main"
# A SEPARATE process from `breezy`, not a subcommand of it: the NWS collector
# must start on a host with no venue configuration, and the quote-tape recorder
# must refuse to start without it. See `breezy.runtime.quote_tape_cli`.
breezy-quote-tape = "breezy.runtime.quote_tape_cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
