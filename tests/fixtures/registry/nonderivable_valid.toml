# Minimal valid registry used to prove cli_location is read verbatim from the
# file and is NOT derived by stripping a leading "K" from the ICAO. If it
# were derived, KABC would yield "ABC", not "ZZZ".
registry_version = "test-1"

[sites.polymarket_us.TST]
icao = "KABC"
cli_location = "ZZZ"
venue_city_token = "not-tst"
issuing_office = "KXYZ"
iana_tz = "America/New_York"
std_utc_offset_hours = -5.0
body_header_regex = '^\.\.\.THE\s+TEST\s+CLIMATE\s+SUMMARY\s+FOR\b'
never_substitute = ["KDEF"]
never_substitute_cli_locations = ["DEF"]
settlement_time_local = "08:00"
settlement_timezone = "America/New_York"
settlement_delay_time_local = "11:00"
settlement_delay_timezone = "America/New_York"
no_data_fallback_days = 7

[sites.polymarket_us.TST.open_meteo]
settlement_eligible = false
lat = 40.0
lon = -70.0
elevation_m = 10.0
